services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: memora
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    ports:
      - '6379:6379'

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - '8001:8001'
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - '7000:7000'
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - api_storage:/app/storage

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ['node', 'dist/worker.js']
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - api_storage:/app/storage

volumes:
  postgres_data:
  api_storage:
